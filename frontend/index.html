<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800;900&display=swap" />
    <title>AutoBlog 편집국</title>
    <script>
      // 저장된 화면 색을 첫 그리기 전에 적용 (src/components/layout/siteTheme.ts와 같은 키)
      (function () {
        var t = 'paper';
        try { t = localStorage.getItem('site-theme') || 'paper'; } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = 'paper';
        document.documentElement.classList.add('theme-' + t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
